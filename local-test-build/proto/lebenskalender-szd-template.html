<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biographie – Stefan Zweig digital (Prototyp Lebenskalender)</title>
<!-- Prototype of an alternative Lebenskalender presentation inside the real page
     shell of stefanzweig.digital. Generated by local-test-build/proto/build-lebenskalender-szd.py
     from lebenskalender-szd-template.html: navbar and footer are copied from the live
     page, stylesheets and assets load from the live site via <base>. The TEI is read
     from SZDBIO.xml next to this file (resolved against the document URL, not <base>). -->
<base href="https://stefanzweig.digital/">
<link href="/lib/2.0/bootstrap-4.5.0-dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/szd/css/szd.css" rel="stylesheet">
<link href="/szd/css/tokens.css" rel="stylesheet">
<link href="/szd/css/navbar.css" rel="stylesheet">
<link rel="stylesheet" href="/lib/2.0/fa/css/all.css">
<style>
	/* prototype-only additions; everything else comes from szd.css */
	.lk-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem 1.2rem; align-items: center; font-size: 13px; line-height: 1.4; margin: .3rem 0 .2rem; }
	.lk-controls .group { display: inline-flex; gap: .25rem; }
	.lk-btn, .lk-chip { border: 1px solid #d4d4d4; background: #fff; border-radius: 999px; padding: 0 .6rem; font: inherit; font-size: 12px; cursor: pointer; color: #131313; }
	.lk-btn[aria-pressed="true"], .lk-chip[aria-pressed="true"] { background: #631a34; color: #fff; border-color: #631a34; }
	.lk-chip small { opacity: .7; margin-left: .3rem; }
	.lk-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: .25rem; }
	.lk-scale { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1px; align-items: end; height: 46px; margin: .2rem 0 .4rem; }
	.lk-scale a { display: block; position: relative; height: 100%; text-decoration: none; }
	.lk-scale a .bar { position: absolute; bottom: 14px; left: 15%; right: 15%; background: #dccfa8; border-radius: 2px 2px 0 0; }
	.lk-scale a:hover .bar, .lk-scale a.current .bar { background: #631a34; }
	.lk-scale a .lbl { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font-size: 10px; line-height: 12px; color: #6c757d; }
	.lk-scale a.decade .lbl { color: #131313; font-weight: bold; }
	.lk-scale a.dim .bar { opacity: .25; }
	#content h2.text-left { margin-top: 2rem; }
	#content h2.text-left small { font-size: 14px; color: #6c757d; font-weight: normal; margin-left: .6rem; }
	.lk-ev { display: grid; grid-template-columns: 11rem 1fr; gap: 0 1rem; padding: .5rem 0; border-bottom: 1px dotted #d4d4d4; text-align: left; }
	.lk-ev .where { color: #631a34; font-weight: bold; font-size: 14px; line-height: 18px; text-transform: uppercase; }
	.lk-ev .when { color: #6c757d; font-size: 13px; line-height: 18px; }
	.lk-ev .text { font-size: 15px; line-height: 22px; }
	.lk-ev .text a { color: #631a34; }
	.lk-ev .perma { font-size: 11px; color: #6c757d; margin-left: .5rem; opacity: 0; }
	.lk-ev:hover .perma { opacity: 1; }
	body.compact .lk-ev .text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	body.compact .lk-ev { padding: .2rem 0; }
	.lk-empty { color: #6c757d; padding: 2rem 0; text-align: center; }
	.lk-note { font-size: 12px; color: #6c757d; text-align: center; margin: 0 0 .5rem; }
	[hidden] { display: none !important; }
	@media (max-width: 600px) {
		.lk-ev { grid-template-columns: 1fr; }
		.lk-scale a .lbl { display: none; }
		.lk-scale a.decade .lbl { display: block; }
	}
</style>
</head>
<body>
{{HEADER}}
<main class="container">
	<section class="card">
		<article class="sticky-top header-card-nav">
			<div class="row">
				<div class="col-2"> </div>
				<div class="col-8"><h2 class="text-uppercase" id="title">Biographie <a href="/archive/objects/o:szd.glossar/methods/sdef:SKOS/get?locale=de#Biography" title="Informationen zum Sammlungsbereich"><i class="fa fa-info-circle info_icon_header" aria-hidden="true"> </i></a></h2></div>
				<div class="col-2 text-right"><a href="/o:szd.lebenskalender/TEI_SOURCE" target="_blank"><img alt="TEI" height="25" id="tei" src="/templates/img/tei_icon.jpg" title="TEI"></a> <a href="/o:szd.lebenskalender/RDF" target="_blank"><img alt="RDF" height="25" id="rdf" src="/templates/img/RDF_icon.png" title="RDF"></a></div>
			</div>
			<div class="lk-controls">
				<span class="group">
					<button type="button" class="lk-btn" data-density="full" aria-pressed="true">Volltext</button>
					<button type="button" class="lk-btn" data-density="compact" aria-pressed="false">Kompakt</button>
				</span>
				<span class="lk-chips" id="places"></span>
			</div>
			<nav class="lk-scale" id="scale" aria-label="Jahre"></nav>
		</article>
		<p class="lk-note" id="note"></p>
		<div class="row"><div class="col-12" id="content"></div></div>
	</section>
</main>
{{FOOTER}}
<script src="/lib/2.0/jquery-3.5.1.min.js"> </script>
<script src="/szd/js/popper.min.js"> </script>
<script src="/lib/2.0/bootstrap-4.5.0-dist/js/bootstrap.min.js"> </script>
<script>
(function () {
	'use strict';

	// resolved against the document, because <base> points at the live site
	var TEI_URL = new URL('SZDBIO.xml', document.location.href).href;
	var PERSON_SEARCH = 'https://stefanzweig.digital/archive/objects/query:szd.person_search/methods/sdef:Query/get?params=%241%7C%3Chttps%3A%2F%2Fgams.uni-graz.at%2Fo%3Aszd.personen%23{ID}%3E%3B%242%7C{LOC}&locale={LOC}';
	var TEI = 'http://www.tei-c.org/ns/1.0';
	var XML = 'http://www.w3.org/XML/1998/namespace';

	var state = { lang: 'de', density: 'full', place: null };
	var events = [];
	var L = {
		de: { title: 'Biographie', full: 'Volltext', compact: 'Kompakt', all: 'Alle Orte', empty: 'Keine Einträge für diese Auswahl.', perma: 'Permalink', entries: 'Einträge',
			note: 'Prototyp. Jahresskala mit Zahl der Einträge je Jahr, Ortsfilter aus den Kopfzeilen; Einträge ohne Ort erscheinen nur in der Gesamtsicht.' },
		en: { title: 'Biography', full: 'Full text', compact: 'Compact', all: 'All places', empty: 'No entries for this selection.', perma: 'Permalink', entries: 'entries',
			note: 'Prototype. Year scale with the number of entries per year, place filters from the headings; entries without a place appear only in the full view.' }
	};

	function childrenNS(el, name) {
		return Array.prototype.filter.call(el.childNodes, function (n) { return n.nodeType === 1 && n.localName === name; });
	}
	function lang(el) { return el.getAttributeNS(XML, 'lang'); }

	function parseHead(span) {
		var date = span.getElementsByTagNameNS(TEI, 'date')[0];
		var when = date ? (date.getAttribute('when') || date.getAttribute('from') || '') : '';
		var clone = span.cloneNode(true);
		var d = clone.getElementsByTagNameNS(TEI, 'date')[0];
		if (d) { d.parentNode.removeChild(d); }
		var place = clone.textContent.replace(/[\s,]+$/, '').replace(/\s+/g, ' ').trim();
		return { when: when, dateText: date ? date.textContent.trim() : '', place: place };
	}

	function renderAb(ab, loc) {
		var out = document.createElement('span');
		function walk(node, target) {
			Array.prototype.forEach.call(node.childNodes, function (n) {
				if (n.nodeType === 3) { target.appendChild(document.createTextNode(n.nodeValue.replace(/\s+/g, ' '))); return; }
				if (n.nodeType !== 1) { return; }
				var el;
				var ref = n.getAttribute('ref') || '';
				if (n.localName === 'name' && n.getAttribute('type') === 'person' && ref.indexOf('#') === 0) {
					el = document.createElement('a');
					el.href = PERSON_SEARCH.replace('{ID}', ref.substring(1)).replace(/\{LOC\}/g, loc);
					el.target = '_blank'; el.title = 'Suchanfrage';
				} else if (n.localName === 'name' && n.getAttribute('type') === 'book') {
					el = document.createElement('a');
					el.href = 'https://stefanzweig.digital/o:szd.bibliothek/sdef:TEI/get?locale=' + loc + ref;
					el.target = '_blank';
				} else if (n.localName === 'hi') {
					el = document.createElement('em');
				} else {
					el = document.createElement('span');
				}
				walk(n, el);
				target.appendChild(el);
			});
		}
		walk(ab, out);
		return out;
	}

	function parse(doc) {
		var list = doc.getElementsByTagNameNS(TEI, 'event');
		return Array.prototype.map.call(list, function (ev) {
			var head = ev.getElementsByTagNameNS(TEI, 'head')[0];
			var spans = head ? childrenNS(head, 'span') : [];
			var abs = childrenNS(ev, 'ab');
			var byLang = {};
			spans.forEach(function (s) { byLang[lang(s)] = parseHead(s); });
			var abByLang = {};
			abs.forEach(function (a) { abByLang[lang(a)] = a; });
			var de = byLang.de || byLang.en || { when: '', dateText: '', place: '' };
			return {
				id: ev.getAttributeNS(XML, 'id') || ev.getAttribute('xml:id'),
				when: de.when,
				year: de.when.substring(0, 4),
				head: byLang,
				ab: abByLang
			};
		}).filter(function (e) { return e.year; });
	}

	function placeKey(e) { return (e.head.de && e.head.de.place) || ''; }

	function buildScale() {
		var years = {};
		events.forEach(function (e) { years[e.year] = (years[e.year] || 0) + 1; });
		var min = Math.min.apply(null, events.map(function (e) { return +e.year; }));
		var max = Math.max.apply(null, events.map(function (e) { return +e.year; }));
		var maxCount = Math.max.apply(null, Object.keys(years).map(function (y) { return years[y]; }));
		var scale = document.getElementById('scale');
		scale.innerHTML = '';
		for (var y = min; y <= max; y++) {
			var a = document.createElement('a');
			a.href = new URL('#y' + y, document.location.href).href;
			a.dataset.year = y;
			a.className = (y % 10 === 0 ? 'decade' : '') + (years[y] ? '' : ' dim');
			a.title = y + (years[y] ? ' (' + years[y] + ')' : '');
			var bar = document.createElement('span');
			bar.className = 'bar';
			bar.style.height = years[y] ? Math.max(3, Math.round(30 * years[y] / maxCount)) + 'px' : '1px';
			a.appendChild(bar);
			if (y % 10 === 0 || y === min || y === max) {
				var lbl = document.createElement('span');
				lbl.className = 'lbl';
				lbl.textContent = y;
				a.appendChild(lbl);
			}
			scale.appendChild(a);
		}
	}

	function buildPlaces() {
		var counts = {};
		events.forEach(function (e) { var p = placeKey(e); if (p) { counts[p] = (counts[p] || 0) + 1; } });
		var names = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); });
		var box = document.getElementById('places');
		box.innerHTML = '';
		box.appendChild(chip(L[state.lang].all, events.length, null));
		names.slice(0, 14).forEach(function (n) { box.appendChild(chip(n, counts[n], n)); });
		function chip(label, count, value) {
			var b = document.createElement('button');
			b.type = 'button';
			b.className = 'lk-chip';
			b.textContent = label;
			var s = document.createElement('small');
			s.textContent = count;
			b.appendChild(s);
			b.setAttribute('aria-pressed', String(state.place === value));
			b.addEventListener('click', function () { state.place = value; render(); });
			return b;
		}
	}

	function render() {
		var loc = state.lang;
		var t = L[loc];
		document.documentElement.lang = loc;
		document.getElementById('title').firstChild.nodeValue = t.title + ' ';
		document.getElementById('note').textContent = t.note;
		document.body.className = state.density;
		Array.prototype.forEach.call(document.querySelectorAll('[data-density]'), function (b) {
			b.setAttribute('aria-pressed', String(b.dataset.density === state.density));
			b.textContent = t[b.dataset.density];
		});
		buildPlaces();

		var main = document.getElementById('content');
		main.innerHTML = '';
		var shown = 0, currentYear = null, yearHeading = null, yearCount = 0;
		events.forEach(function (e) {
			var visible = !state.place || placeKey(e) === state.place;
			if (e.year !== currentYear) {
				if (yearHeading) { yearHeading.hidden = yearCount === 0; }
				currentYear = e.year; yearCount = 0;
				yearHeading = document.createElement('h2');
				yearHeading.className = 'text-left';
				yearHeading.id = 'y' + e.year;
				yearHeading.textContent = e.year;
				main.appendChild(yearHeading);
			}
			if (!visible) { return; }
			yearCount++; shown++;
			var h = e.head[loc] || e.head.de || {};
			var art = document.createElement('article');
			art.className = 'lk-ev';
			art.id = e.id;
			var meta = document.createElement('div');
			var where = document.createElement('div'); where.className = 'where'; where.textContent = h.place || '';
			var when = document.createElement('div'); when.className = 'when'; when.textContent = h.dateText || e.when;
			meta.appendChild(where); meta.appendChild(when);
			var text = document.createElement('div'); text.className = 'text';
			var ab = e.ab[loc] || e.ab.de;
			if (ab) { text.appendChild(renderAb(ab, loc)); }
			var perma = document.createElement('a');
			perma.className = 'perma'; perma.href = new URL('#' + e.id, document.location.href).href; perma.textContent = '#' + e.id; perma.title = t.perma;
			text.appendChild(perma);
			art.appendChild(meta); art.appendChild(text);
			main.appendChild(art);
		});
		if (yearHeading) { yearHeading.hidden = yearCount === 0; }
		if (!shown) {
			var p = document.createElement('p'); p.className = 'lk-empty'; p.textContent = t.empty; main.appendChild(p);
		}
		var visibleYears = {};
		Array.prototype.forEach.call(main.querySelectorAll('h2.text-left:not([hidden])'), function (h2) { visibleYears[h2.textContent] = true; });
		Array.prototype.forEach.call(document.querySelectorAll('#scale a'), function (a) { a.classList.toggle('dim', !visibleYears[a.dataset.year]); });
		observeYears();
	}

	var observer = null;
	function observeYears() {
		if (observer) { observer.disconnect(); }
		if (!('IntersectionObserver' in window)) { return; }
		observer = new IntersectionObserver(function (entries) {
			entries.forEach(function (en) {
				if (!en.isIntersecting) { return; }
				var y = en.target.textContent;
				Array.prototype.forEach.call(document.querySelectorAll('#scale a'), function (a) { a.classList.toggle('current', a.dataset.year === y); });
			});
		}, { rootMargin: '-220px 0px -70% 0px' });
		Array.prototype.forEach.call(document.querySelectorAll('#content h2.text-left:not([hidden])'), function (h2) { observer.observe(h2); });
	}

	document.addEventListener('click', function (ev) {
		var b = ev.target.closest('[data-density]');
		if (!b) { return; }
		state.density = b.dataset.density;
		render();
	});

	// the DE|EN switch of the copied navbar calls this instead of reloading
	window.setLkLang = function (loc) { state.lang = loc; render(); };

	window.lebenskalenderInit = function (xmlText) {
		var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
		events = parse(doc).sort(function (a, b) { return a.when < b.when ? -1 : a.when > b.when ? 1 : 0; });
		buildScale();
		render();
		return events.length;
	};

	if (typeof fetch === 'function' && document.location.protocol !== 'about:') {
		fetch(TEI_URL).then(function (r) { return r.text(); }).then(window.lebenskalenderInit).catch(function (e) {
			document.getElementById('content').textContent = 'TEI konnte nicht geladen werden: ' + e;
		});
	}
})();
</script>
</body>
</html>
